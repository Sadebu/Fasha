
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Хроники Европы 1922-1939</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--card:#12121a;--card2:#1a1a25;--border:#2a2a35;--amber:#d97706;--amber-light:#fbbf24;--amber-dark:#92400e;--text:#e5e5e5;--text-dim:#9ca3af;--green:#22c55e;--red:#ef4444}
html,body{width:100%;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.serif{font-family:'Playfair Display',Georgia,serif}
button{cursor:pointer;border:none;font-family:inherit;transition:all .2s}
button:active{transform:scale(.97)}
input{font-family:inherit}
.screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.container{max-width:680px;width:100%}
.card{background:var(--card);border:1px solid rgba(217,119,6,.15);border-radius:16px;overflow:hidden;backdrop-filter:blur(10px)}
.card-header{background:linear-gradient(135deg,rgba(127,29,29,.5),rgba(146,64,14,.5));padding:16px 20px;border-bottom:1px solid rgba(217,119,6,.15)}
.card-body{padding:16px 20px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#b45309,#d97706);color:#fff;font-weight:600;padding:12px 28px;border-radius:12px;font-size:15px;box-shadow:0 4px 15px rgba(146,64,14,.3)}
.btn:hover{background:linear-gradient(135deg,#d97706,#f59e0b)}
.btn-sm{padding:10px 20px;font-size:14px;border-radius:10px}
.btn-block{width:100%}
.btn-ghost{background:rgba(180,83,9,.4);box-shadow:none}
.btn-ghost:hover{background:rgba(180,83,9,.6)}
.choice-btn{width:100%;text-align:left;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:14px;line-height:1.5;display:flex;align-items:flex-start;gap:10px;transition:all .2s}
.choice-btn:hover:not(:disabled){border-color:var(--amber);background:rgba(26,26,37,.8)}
.choice-btn.correct{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.5);color:#86efac}
.choice-btn.wrong{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3);color:#fca5a5}
.choice-btn:disabled{opacity:.6;cursor:default}
.letter{width:24px;height:24px;border-radius:50%;border:1.5px solid #555;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}
.feedback{padding:16px;border-radius:12px;margin-top:16px;animation:fadeIn .3s}
.feedback.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3)}
.feedback.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3)}
.progress{width:100%;height:5px;background:rgba(55,65,81,.5);border-radius:3px;overflow:hidden;margin-bottom:20px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--amber-dark),var(--amber));border-radius:3px;transition:width .5s}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:11px;color:var(--text-dim)}
.score-badge{background:var(--card);border:1px solid rgba(217,119,6,.2);border-radius:12px;padding:8px 14px}
.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tf-btn{padding:10px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--card2);color:var(--text-dim);text-align:center}
.tf-btn.active-yes{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5);color:#86efac}
.tf-btn.active-no{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5);color:#fca5a5}
.tf-btn.show-correct{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.4);color:#86efac}
.tf-btn.show-wrong{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3);color:#fca5a5}
.timeline-item{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.timeline-arrows{display:flex;flex-direction:column;gap:2px}
.timeline-arrows button{background:none;color:var(--amber);font-size:10px;padding:2px 6px;border-radius:4px}
.timeline-arrows button:disabled{color:#444;cursor:default}
.timeline-num{width:26px;height:26px;border-radius:50%;background:rgba(146,64,14,.3);border:1px solid rgba(217,119,6,.3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--amber-light);flex-shrink:0}
.terms-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:600px){.terms-grid{grid-template-columns:1fr 1fr}}
.term-btn{width:100%;text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:13px;transition:all .2s}
.term-btn:hover:not(:disabled){border-color:var(--amber)}
.term-btn.selected{background:rgba(146,64,14,.2);border-color:var(--amber);color:var(--amber-light)}
.term-btn.matched{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.4);color:#86efac}
.multi-check{width:20px;height:20px;border-radius:4px;border:1.5px solid #555;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:2px}
.multi-check.checked{border-color:var(--amber);background:rgba(146,64,14,.4);color:var(--amber-light)}
.input-field{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-size:15px;outline:none}
.input-field:focus{border-color:var(--amber)}
.doc-quote{background:var(--card2);border:1px solid rgba(217,119,6,.15);border-radius:12px;padding:14px;font-style:italic;color:var(--text-dim);font-size:13px;line-height:1.7;margin-bottom:16px}
.hidden{display:none!important}
.country-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.country-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.tag{display:inline-block;background:rgba(146,64,14,.15);color:rgba(251,191,36,.7);border:1px solid rgba(146,64,14,.2);border-radius:20px;padding:4px 12px;font-size:11px;margin:3px}
@media(max-width:480px){
  .screen{padding:12px}
  .card-body{padding:14px 16px 16px}
  .card-header{padding:14px 16px}
  .btn{padding:12px 20px;font-size:14px}
}
</style>
</head>
<body>

<div id="app"></div>

<script>
// ===== GAME DATA =====
const chapters = [

        {text:'Желание итальянского народа расширить колониальную империю',correct:false,feedback:'Колониальные амбиции были, но главной причиной была внутренняя нестабильность.'}
      ]

    narrative:'Вы прибыли в Рим. На улицах — вооружённые чёрнорубашечники. Их десятки тысяч.\n\nКороль Виктор Эммануил III мог бы отдать приказ армии разогнать мятежников. Но король колеблется...\n\nВ ночь на 29 октября король поручает Муссолини формирование правительства. Фашисты приходят к власти «легально».',

        {statement:'Муссолини лично возглавлял колонны при входе в Рим',isTrue:false,explanation:'Нет! Муссолини оставался в Милане и прибыл в Рим только после получения власти.'},

    narrative:'Вернувшись в Париж, вы решаете систематизировать все события в Италии. Расположите события в правильном хронологическом порядке:',
    type:'timeline',

    data:{

    narrative:'Вы получили доступ к «Доктрине фашизма» (1932). Прочитайте выдержку:\n\n«Всё в государстве, ничего вне государства, ничего против государства... Фашизм отрицает демократию... Народ не управляет, а лишь выражает согласие.»',
    type:'document',

          {text:'Государство контролирует все сферы жизни, нет независимых институтов',correct:true,feedback:'Верно! Это суть тоталитаризма.'},

        ]},
        {question:'Как Муссолини описывает отношение фашизма к демократии?',choices:[
          {text:'Демократия — идеальная форма правления',correct:false,feedback:'Нет. «Фашизм отрицает демократию».'},
          {text:'Народ реально управляет государством',correct:false,feedback:'Нет. «Народ не управляет, а лишь выражает согласие».'},
          {text:'Фашизм отрицает демократию, народ лишь формально «соглашается»',correct:true,feedback:'Верно! Муссолини сводит роль народа к формальному одобрению.'},
          {text:'Фашизм улучшает демократию',correct:false,feedback:'Нет. Речь о полном отрицании демократии.'}
        ]}
      ]
    }
  },
  {
    id:'fillblank', title:'Заполните пробелы', location:'Редакция «Le Monde»', year:'1933',
    narrative:'Ваш редактор проверяет материал: "Заполни пропуски — посмотрим, насколько ты разобрался в теме."',
    type:'fillblank',
    data:{
      items:[
        {sentence:'Бенито Муссолини носил титул «___», что означает «вождь».',blanks:['дуче','дуце'],hint:'Итальянское слово, аналог «фюрер»'},

      ]
    }

  {

    narrative:'1933 год. Гитлер стал рейхсканцлером. Нацисты во многом копируют итальянских фашистов, но идут ещё дальше. Выберите ВСЕ верные утверждения:',

const MAX_SCORE = 80;

// ===== UTILITIES =====
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function $(s,p){return(p||document).querySelector(s)}
function $$(s,p){return[...(p||document).querySelectorAll(s)]}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e}

// ===== STATE =====
let state = {
  screen:'start', chapter:0, score:0, feedback:null,
  shuffledChoices:[], shuffledTimeline:[], timelineOrder:[],
  shuffledDefs:[], termMatches:{}, selectedTerm:null,
  tfAnswers:{}, tfChecked:false,
  fbAnswers:[], fbChecked:false,
  multiSelected:new Set(), multiChecked:false,
  docAnswers:[], docShuffled:[],
  showIntro:true
};

function resetChapter(){
  const ch=chapters[state.chapter];
  state.feedback=null;state.showIntro=true;
  state.tfAnswers={};state.tfChecked=false;
  state.fbAnswers=new Array(ch.data.items?.length||0).fill('');state.fbChecked=false;
  state.multiSelected=new Set();state.multiChecked=false;
  state.docAnswers=[];
  state.termMatches={};state.selectedTerm=null;
  if(ch.type==='choice'||ch.type==='multi') state.shuffledChoices=shuffle(ch.data.choices);
  if(ch.type==='timeline'){state.shuffledTimeline=shuffle(ch.data.events);state.timelineOrder=shuffle(ch.data.events).map(e=>e.id)}
  if(ch.type==='terms'){state.shuffledDefs=shuffle(ch.data.terms)}
  if(ch.type==='document'){state.docShuffled=ch.data.questions.map(q=>shuffle(q.choices));state.docAnswers=new Array(ch.data.questions.length).fill(null)}
}

function typeLabel(t){
  const m={choice:'🔘 Выбор',truefalse:'⚖️ В/Н',timeline:'📅 Хронология',terms:'🔗 Пары',document:'📄 Документ',fillblank:'✍️ Пропуски',multi:'☑️ Несколько'};
  return m[t]||t;
}

function renderChapterBody(){
  const body=$('#chapterBody');if(!body)return;
  const ch=chapters[state.chapter];
  body.innerHTML='';
  
  if(state.showIntro){
    const div=el('div');
    ch.narrative.split('\n\n').forEach(p=>{
      const pe=el('p');pe.style.cssText='color:#d1d5db;font-size:14px;line-height:1.7;margin-bottom:10px';pe.textContent=p;
      div.appendChild(pe);
    });
    const btn=el('button','btn btn-sm btn-block','');
    const labels={timeline:'📋 Расположить события',terms:'🔗 Соединить термины',truefalse:'⚖️ Оценить утверждения',fillblank:'✍️ Заполнить пропуски',multi:'☑️ Выбрать утверждения',document:'📄 Анализировать документ',choice:'➡️ Продолжить'};
    btn.textContent=labels[ch.type]||'➡️ Продолжить';
    btn.style.marginTop='12px';
    btn.onclick=()=>{state.showIntro=false;renderChapterBody()};
    div.appendChild(btn);
    body.appendChild(div);
    return;
  }
  
  if(ch.type==='choice') renderChoice(body,ch);
  else if(ch.type==='truefalse') renderTrueFalse(body,ch);
  else if(ch.type==='timeline') renderTimeline(body,ch);
  else if(ch.type==='terms') renderTerms(body,ch);
  else if(ch.type==='document') renderDocument(body,ch);
  else if(ch.type==='fillblank') renderFillBlank(body,ch);
  else if(ch.type==='multi') renderMulti(body,ch);
  
  if(state.feedback) renderFeedback(body);
}

function renderChoice(body,ch){
  const q=el('p');q.className='serif';q.style.cssText='color:#fde68a;font-weight:600;margin-bottom:14px;font-size:15px';q.textContent=ch.data.question;
  body.appendChild(q);
  const wrap=el('div');wrap.style.cssText='display:flex;flex-direction:column;gap:8px';
  state.shuffledChoices.forEach((c,i)=>{
    const btn=el('button','choice-btn');
    const letter=el('span','letter');
    if(state.feedback){letter.textContent=c.correct?'✓':String.fromCharCode(65+i);if(c.correct){btn.classList.add('correct');letter.style.cssText='border-color:#22c55e;background:rgba(34,197,94,.2)'}else{btn.classList.add('wrong')}}
    else{letter.textContent=String.fromCharCode(65+i)}
    const txt=el('span');txt.style.fontSize='13px';txt.textContent=c.text;
    btn.appendChild(letter);btn.appendChild(txt);
    btn.disabled=!!state.feedback;
    btn.onclick=()=>{
      state.feedback={text:c.feedback,ok:c.correct};
      if(c.correct)state.score+=10;
      renderChapterBody();
    };
    wrap.appendChild(btn);
  });
  body.appendChild(wrap);
}

function renderTrueFalse(body,ch){
  const inst=el('p');inst.style.cssText='color:#fde68a;font-weight:600;font-size:13px;margin-bottom:12px';inst.textContent=ch.data.instruction;
  body.appendChild(inst);
  ch.data.items.forEach((item,i)=>{
    const card=el('div');card.style.cssText='background:rgba(26,26,37,.5);border:1px solid #2a2a35;border-radius:12px;padding:12px;margin-bottom:8px';
    const st=el('p');st.style.cssText='color:#e5e5e5;font-size:13px;margin-bottom:8px;line-height:1.5';st.textContent=item.statement;
    card.appendChild(st);
    const grid=el('div','tf-grid');
    const yesBtn=el('button','tf-btn'+(state.tfAnswers[i]===true?' active-yes':'')+(state.tfChecked&&item.isTrue?' show-correct':''));yesBtn.textContent='✓ Верно';
    const noBtn=el('button','tf-btn'+(state.tfAnswers[i]===false?' active-no':'')+(state.tfChecked&&!item.isTrue?' show-wrong':''));noBtn.textContent='✗ Неверно';
    yesBtn.disabled=state.tfChecked;noBtn.disabled=state.tfChecked;
    yesBtn.onclick=()=>{state.tfAnswers[i]=true;renderChapterBody()};
    noBtn.onclick=()=>{state.tfAnswers[i]=false;renderChapterBody()};
    grid.appendChild(yesBtn);grid.appendChild(noBtn);
    card.appendChild(grid);
    if(state.tfChecked){
      const exp=el('div');exp.style.cssText=`margin-top:8px;padding:8px;border-radius:8px;font-size:11px;line-height:1.5;${state.tfAnswers[i]===item.isTrue?'background:rgba(34,197,94,.08);color:#86efac;border:1px solid rgba(34,197,94,.2)':'background:rgba(239,68,68,.08);color:#fca5a5;border:1px solid rgba(239,68,68,.2)'}`;
      exp.textContent=item.explanation;card.appendChild(exp);
    }
    body.appendChild(card);
  });
  if(!state.tfChecked){
    const btn=el('button','btn btn-sm');btn.textContent='✓ Проверить';btn.style.marginTop='12px';
    btn.disabled=Object.keys(state.tfAnswers).length<ch.data.items.length;
    btn.style.opacity=btn.disabled?'.4':'1';
    btn.onclick=()=>{
      state.tfChecked=true;
      let correct=0;
      ch.data.items.forEach((item,i)=>{if(state.tfAnswers[i]===item.isTrue)correct++});
      state.score+=Math.round(correct/ch.data.items.length*10);
      if(correct===ch.data.items.length)state.feedback={text:`Безупречно! Все ${ch.data.items.length} утверждений верны!`,ok:true};
      else state.feedback={text:`Верно: ${correct} из ${ch.data.items.length}.`,ok:correct>=ch.data.items.length/2};
      renderChapterBody();
    };
    body.appendChild(btn);
  }
}

function renderTimeline(body,ch){
  const hint=el('p');hint.style.cssText='color:#9ca3af;font-size:12px;margin-bottom:12px';hint.textContent='Используйте стрелки ▲▼ для сортировки:';
  body.appendChild(hint);
  const wrap=el('div');
  state.timelineOrder.forEach((eid,idx)=>{
    const ev=state.shuffledTimeline.find(e=>e.id===eid);
    const item=el('div','timeline-item');
    const arrows=el('div','timeline-arrows');
    const up=el('button');up.textContent='▲';up.disabled=idx===0;up.onclick=()=>{if(idx>0){[state.timelineOrder[idx],state.timelineOrder[idx-1]]=[state.timelineOrder[idx-1],state.timelineOrder[idx]];renderChapterBody()}};
    const dn=el('button');dn.textContent='▼';dn.disabled=idx===state.timelineOrder.length-1;dn.onclick=()=>{if(idx<state.timelineOrder.length-1){[state.timelineOrder[idx],state.timelineOrder[idx+1]]=[state.timelineOrder[idx+1],state.timelineOrder[idx]];renderChapterBody()}};
    arrows.appendChild(up);arrows.appendChild(dn);
    const num=el('span','timeline-num');num.textContent=idx+1;
    const txt=el('span');txt.style.cssText='color:#e5e5e5;font-size:12px;flex:1;line-height:1.4';txt.textContent=ev?.text||'';
    item.appendChild(arrows);item.appendChild(num);item.appendChild(txt);
    wrap.appendChild(item);
  });
  body.appendChild(wrap);
  if(!state.feedback){
    const btn=el('button','btn btn-sm');btn.textContent='✓ Проверить порядок';btn.style.marginTop='12px';
    btn.onclick=()=>{
      const correct=ch.data.events.slice().sort((a,b)=>a.year-b.year).map(e=>e.id);
      const isCorrect=JSON.stringify(state.timelineOrder)===JSON.stringify(correct);
      if(isCorrect){state.score+=10;state.feedback={text:'Отлично! Хронология верна!',ok:true}}
      else{
        const txt=correct.map((id,i)=>{const e=ch.data.events.find(x=>x.id===id);return`${i+1}. ${e.year} — ${e.text}`}).join('\n');
        state.feedback={text:`Правильный порядок:\n${txt}`,ok:false};
      }
      renderChapterBody();
    };
    body.appendChild(btn);
  }
}

function renderTerms(body,ch){
  const hint=el('p');hint.style.cssText='color:#9ca3af;font-size:12px;margin-bottom:12px';hint.textContent='Нажмите на термин, затем на определение:';
  body.appendChild(hint);
  const grid=el('div','terms-grid');
  const left=el('div');
  const leftTitle=el('p');leftTitle.style.cssText='color:rgba(252,211,77,.6);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600';leftTitle.textContent='Термины';
  left.appendChild(leftTitle);
  ch.data.terms.forEach(t=>{
    const btn=el('button','term-btn'+(state.termMatches[t.term]?' matched':'')+(state.selectedTerm===t.term?' selected':''));
    btn.innerHTML=t.term+(state.termMatches[t.term]?' <span style="color:#22c55e">✓</span>':'');
    btn.disabled=!!state.termMatches[t.term]||!!state.feedback;
    btn.onclick=()=>{state.selectedTerm=t.term;renderChapterBody()};
    left.appendChild(btn);
  });
  const right=el('div');
  const rightTitle=el('p');rightTitle.style.cssText='color:rgba(252,211,77,.6);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600';rightTitle.textContent='Определения';
  right.appendChild(rightTitle);
  const matched=Object.values(state.termMatches);
  state.shuffledDefs.filter(d=>!matched.includes(d.definition)).forEach(d=>{
    const btn=el('button','term-btn');btn.style.fontSize='12px';btn.textContent=d.definition;
    btn.disabled=!state.selectedTerm||!!state.feedback;
    btn.style.opacity=btn.disabled?'.5':'1';
    btn.onclick=()=>{
      if(!state.selectedTerm)return;
      state.termMatches[state.selectedTerm]=d.definition;
      state.selectedTerm=null;
      if(Object.keys(state.termMatches).length===ch.data.terms.length){
        let correct=0;
        Object.entries(state.termMatches).forEach(([term,def])=>{const c=ch.data.terms.find(t=>t.term===term);if(c&&c.definition===def)correct++});
        state.score+=Math.round(correct/ch.data.terms.length*10);
        if(correct===ch.data.terms.length)state.feedback={text:`Превосходно! Все ${ch.data.terms.length} терминов верны!`,ok:true};
        else state.feedback={text:`Верно: ${correct} из ${ch.data.terms.length}.\n\n${ch.data.terms.map(t=>`• ${t.term} — ${t.definition}`).join('\n')}`,ok:correct>=3};
      }
      renderChapterBody();
    };
    right.appendChild(btn);
  });
  grid.appendChild(left);grid.appendChild(right);
  body.appendChild(grid);
}

function renderDocument(body,ch){
  const quote=el('div','doc-quote');
  quote.innerHTML='<p style="color:rgba(217,119,6,.5);font-size:10px;font-weight:600;margin-bottom:6px;font-style:normal">📄 Из «Доктрины фашизма», 1932:</p>'+ch.narrative.split('\n\n').slice(1).join('<br><br>');
  body.appendChild(quote);
  ch.data.questions.forEach((q,qi)=>{
    const qEl=el('p');qEl.style.cssText='color:#fde68a;font-weight:600;font-size:13px;margin:14px 0 8px';qEl.textContent=`Вопрос ${qi+1}: ${q.question}`;
    body.appendChild(qEl);
    const wrap=el('div');wrap.style.cssText='display:flex;flex-direction:column;gap:6px';
    state.docShuffled[qi]?.forEach((c,ci)=>{
      const btn=el('button','choice-btn');btn.style.fontSize='13px';
      if(state.docAnswers[qi]===ci){btn.style.cssText+='background:rgba(146,64,14,.2);border-color:rgba(217,119,6,.4);color:#fde68a'}
      else if(state.docAnswers[qi]!==null){btn.style.opacity='.5'}
      btn.textContent=c.text;
      btn.disabled=state.docAnswers[qi]!==null;
      btn.onclick=()=>{state.docAnswers[qi]=ci;renderChapterBody()};
      wrap.appendChild(btn);
    });
    body.appendChild(wrap);
  });
  if(!state.feedback){
    const btn=el('button','btn btn-sm');btn.textContent='✓ Проверить ответы';btn.style.marginTop='12px';
    btn.disabled=state.docAnswers.some(a=>a===null);btn.style.opacity=btn.disabled?'.4':'1';
    btn.onclick=()=>{
      let correct=0;
      ch.data.questions.forEach((q,qi)=>{const c=state.docShuffled[qi][state.docAnswers[qi]];if(c&&c.correct)correct++});
      state.score+=Math.round(correct/ch.data.questions.length*10);
      const txt=ch.data.questions.map((q,qi)=>{const c=state.docShuffled[qi][state.docAnswers[qi]];const ok=state.docShuffled[qi].find(x=>x.correct);return`Вопрос ${qi+1}: ${c?.feedback||ok?.feedback}`}).join('\n\n');
      state.feedback={text:txt,ok:correct===ch.data.questions.length};
      renderChapterBody();
    };
    body.appendChild(btn);
  }
}

function renderFillBlank(body,ch){
  const hint=el('p');hint.style.cssText='color:#9ca3af;font-size:12px;margin-bottom:12px';hint.textContent='Заполните пропуски (___):';
  body.appendChild(hint);
  ch.data.items.forEach((item,i)=>{
    const card=el('div');card.style.cssText='background:rgba(26,26,37,.5);border:1px solid #2a2a35;border-radius:12px;padding:12px;margin-bottom:8px';
    const s=el('p');s.style.cssText='color:#e5e5e5;font-size:13px;margin-bottom:8px;line-height:1.5';s.textContent=item.sentence;
    card.appendChild(s);
    const row=el('div');row.style.cssText='display:flex;gap:8px;align-items:center';
    const inp=el('input','input-field');inp.placeholder=item.hint;inp.value=state.fbAnswers[i]||'';
    inp.disabled=state.fbChecked;
    inp.oninput=e=>{state.fbAnswers[i]=e.target.value};
    row.appendChild(inp);
    if(state.fbChecked){
      const ok=item.blanks.some(b=>b.toLowerCase()===(state.fbAnswers[i]||'').trim().toLowerCase());
      const mark=el('span');mark.style.cssText=`font-size:12px;flex-shrink:0;color:${ok?'#22c55e':'#ef4444'}`;
      mark.textContent=ok?'✓':`→ ${item.blanks[0]}`;
      row.appendChild(mark);
    }
    card.appendChild(row);body.appendChild(card);
  });
  if(!state.fbChecked){
    const btn=el('button','btn btn-sm');btn.textContent='✓ Проверить';btn.style.marginTop='12px';
    btn.onclick=()=>{
      state.fbChecked=true;
      let correct=0;
      ch.data.items.forEach((item,i)=>{if(item.blanks.some(b=>b.toLowerCase()===(state.fbAnswers[i]||'').trim().toLowerCase()))correct++});
      state.score+=Math.round(correct/ch.data.items.length*10);
      if(correct===ch.data.items.length)state.feedback={text:`Отлично! Все ${ch.data.items.length} пропусков верны!`,ok:true};
      else state.feedback={text:`Верно: ${correct} из ${ch.data.items.length}. Ответы: ${ch.data.items.map(i=>i.blanks[0].toUpperCase()).join(', ')}`,ok:correct>=2};
      renderChapterBody();
    };
    body.appendChild(btn);
  }
}

function renderMulti(body,ch){
  const q=el('p');q.className='serif';q.style.cssText='color:#fde68a;font-weight:600;margin-bottom:4px;font-size:15px';q.textContent=ch.data.question;
  body.appendChild(q);
  const sub=el('p');sub.style.cssText='color:#6b7280;font-size:11px;margin-bottom:12px';sub.textContent='Выберите все верные утверждения';
  body.appendChild(sub);
  const wrap=el('div');wrap.style.cssText='display:flex;flex-direction:column;gap:8px';
  state.shuffledChoices.forEach((c,i)=>{
    const btn=el('button','choice-btn');
    const check=el('span','multi-check'+(state.multiSelected.has(i)?' checked':''));check.textContent=state.multiSelected.has(i)?'✓':'';
    if(state.multiChecked){
      if(c.correct){btn.classList.add('correct')}
      else if(state.multiSelected.has(i)){btn.classList.add('wrong')}
    }
    const txt=el('span');txt.style.cssText='font-size:13px;flex:1';txt.textContent=c.text;
    btn.appendChild(check);btn.appendChild(txt);
    if(state.multiChecked&&c.feedback){
      const fb=el('p');fb.style.cssText='font-size:10px;color:#9ca3af;margin-top:4px;margin-left:28px';fb.textContent=c.feedback;
      btn.appendChild(fb);
    }
    btn.disabled=state.multiChecked;
    btn.onclick=()=>{
      if(state.multiSelected.has(i))state.multiSelected.delete(i);else state.multiSelected.add(i);
      renderChapterBody();
    };
    wrap.appendChild(btn);
  });
  body.appendChild(wrap);
  if(!state.multiChecked){
    const btn=el('button','btn btn-sm');btn.textContent=`✓ Проверить (${state.multiSelected.size} выбрано)`;btn.style.marginTop='12px';
    btn.disabled=state.multiSelected.size===0;btn.style.opacity=btn.disabled?'.4':'1';
    btn.onclick=()=>{
      state.multiChecked=true;
      const correctIdx=new Set();state.shuffledChoices.forEach((c,i)=>{if(c.correct)correctIdx.add(i)});
      let ok=0,wrong=0;
      state.multiSelected.forEach(i=>{if(correctIdx.has(i))ok++;else wrong++});
      const total=correctIdx.size;
      const acc=Math.max(0,(ok-wrong)/total);
      state.score+=Math.round(acc*10);
      const txt=state.shuffledChoices.map((c,i)=>{const sel=state.multiSelected.has(i);if(sel&&c.correct)return`✓ ${c.text}`;if(!sel&&c.correct)return`⊘ ${c.text} (пропущено)`;if(sel&&!c.correct)return`✗ ${c.text} (лишнее)`;return`  ${c.text}`}).join('\n');
      state.feedback={text:wrong===0&&ok===total?`Безупречно!\n\n${txt}`:`Результат:\n${txt}`,ok:acc>=.7};
      renderChapterBody();
    };
    body.appendChild(btn);
  }
}

function renderFeedback(body){
  const fb=el('div','feedback '+(state.feedback.ok?'ok':'err'));
  const title=el('p');title.style.cssText=`font-weight:700;margin-bottom:6px;font-size:14px;color:${state.feedback.ok?'#86efac':'#fca5a5'}`;
  title.textContent=state.feedback.ok?'✓ Верно!':'✗ Не совсем...';
  fb.appendChild(title);
  const txt=el('p');txt.style.cssText='color:#d1d5db;font-size:13px;white-space:pre-line;line-height:1.6';txt.textContent=state.feedback.text;
  fb.appendChild(txt);
  const btn=el('button','btn btn-sm');btn.style.marginTop='12px';
  btn.textContent=state.chapter<chapters.length-1?'➡️ Следующая глава':'📊 Итоги расследования';
  btn.onclick=()=>{
    if(state.chapter<chapters.length-1){state.chapter++;resetChapter();render()}
    else{state.screen='result';render()}
  };
  fb.appendChild(btn);
  body.appendChild(fb);
}

// ===== INIT =====
render();
</script>
</body>
</html>
